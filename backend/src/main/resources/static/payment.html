<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment - Hospital Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="payment-page">
  <div class="payment-shell">
    <div class="payment-hero mb-4"><div class="d-flex justify-content-between align-items-center gap-3 flex-wrap"><div><h4 class="fw-bold mb-1"><i class="bi bi-shield-check me-2"></i>Secure Appointment Payment</h4><p class="mb-0 opacity-75">Complete payment to confirm your appointment booking.</p></div><button class="btn btn-light btn-sm" id="back-dashboard-btn"><i class="bi bi-arrow-left me-1"></i>Back</button></div></div>
    <div id="payment-alert" class="alert d-none"></div>
    <div class="row g-4"><div class="col-lg-7"><div class="card payment-summary-card mb-4"><div class="card-header bg-white py-3"><h6 class="mb-0 fw-bold"><i class="bi bi-calendar-check me-2 text-primary"></i>Appointment Summary</h6></div><div class="card-body"><div class="payment-detail-row"><span>Doctor Name</span><span id="s-doctor-name">—</span></div><div class="payment-detail-row"><span>Specialization</span><span id="s-specialization">—</span></div><div class="payment-detail-row"><span>Consultation Fee</span><span id="s-fee">—</span></div><div class="payment-detail-row"><span>Appointment Date</span><span id="s-date">—</span></div><div class="payment-detail-row"><span>Appointment Time</span><span id="s-time">—</span></div><div class="payment-detail-row"><span>Reason</span><span id="s-reason">—</span></div><div class="payment-detail-row"><span>Symptoms</span><span id="s-symptoms">—</span></div></div></div><div class="card payment-summary-card"><div class="card-header bg-white py-3"><h6 class="mb-0 fw-bold"><i class="bi bi-person-heart me-2 text-success"></i>Patient Details</h6></div><div class="card-body"><div class="payment-detail-row"><span>Name</span><span id="p-name">—</span></div><div class="payment-detail-row"><span>Email</span><span id="p-email">—</span></div><div class="payment-detail-row"><span>Phone</span><span id="p-phone">—</span></div><div class="payment-detail-row"><span>Blood Group</span><span id="p-blood">—</span></div></div></div></div><div class="col-lg-5"><div class="card payment-method-card sticky-lg-top" style="top:1rem"><div class="card-header bg-white py-3"><h6 class="mb-0 fw-bold"><i class="bi bi-credit-card me-2 text-primary"></i>Choose Payment Method</h6></div><div class="card-body"><form id="payment-form" class="d-grid gap-3"><label class="payment-method-option"><input class="form-check-input" type="radio" name="paymentMethod" value="CARD" data-label="Credit Card" checked/><i class="bi bi-credit-card-2-front"></i><span><strong>Credit Card</strong><small class="d-block text-muted">Visa, Mastercard, RuPay</small></span></label><label class="payment-method-option"><input class="form-check-input" type="radio" name="paymentMethod" value="CARD" data-label="Debit Card"/><i class="bi bi-credit-card"></i><span><strong>Debit Card</strong><small class="d-block text-muted">Bank debit card payment</small></span></label><label class="payment-method-option"><input class="form-check-input" type="radio" name="paymentMethod" value="UPI" data-label="UPI"/><i class="bi bi-phone"></i><span><strong>UPI</strong><small class="d-block text-muted">Google Pay, PhonePe, Paytm</small></span></label><label class="payment-method-option"><input class="form-check-input" type="radio" name="paymentMethod" value="CASH" data-label="Cash"/><i class="bi bi-cash-coin"></i><span><strong>Cash</strong><small class="d-block text-muted">Pay at hospital counter</small></span></label><hr/><div class="d-flex justify-content-between align-items-center"><span class="text-muted">Total Amount</span><span class="fs-4 fw-bold text-success" id="pay-total">₹0.00</span></div><button type="submit" class="btn btn-success btn-lg" id="pay-now-btn"><i class="bi bi-lock-fill me-1"></i>Pay Now</button></form></div></div></div></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireRole('PATIENT')) throw new Error('Unauthorized');
    const pendingRaw = localStorage.getItem('pending_payment_appointment');
    const pendingAppointment = pendingRaw ? JSON.parse(pendingRaw) : null;
    const alertEl = document.getElementById('payment-alert');
    if (!pendingAppointment) { alertEl.textContent = 'No pending appointment payment found. Please select a doctor and appointment slot again.'; alertEl.className = 'alert alert-warning'; alertEl.classList.remove('d-none'); document.getElementById('pay-now-btn').disabled = true; }
    document.getElementById('back-dashboard-btn').addEventListener('click', () => { window.location.href = '/patient-dashboard.html'; });
    function setText(id, value) { document.getElementById(id).textContent = value || '—'; }
    function renderSummary() { if (!pendingAppointment) return; setText('s-doctor-name', 'Dr. ' + pendingAppointment.doctorName); setText('s-specialization', pendingAppointment.doctorSpecialization); setText('s-fee', formatCurrency(pendingAppointment.consultationFee)); setText('s-date', pendingAppointment.appointmentDate); setText('s-time', pendingAppointment.appointmentTime); setText('s-reason', pendingAppointment.reasonForVisit); setText('s-symptoms', pendingAppointment.symptoms); document.getElementById('pay-total').textContent = formatCurrency(pendingAppointment.consultationFee); }
    async function renderPatientDetails() { const user = Auth.get() || {}; setText('p-name', `${user.firstName || ''} ${user.lastName || ''}`.trim()); setText('p-email', user.email); setText('p-phone', user.phone); try { const profile = await get('/patient/profile'); setText('p-phone', profile.user?.phone || user.phone); setText('p-blood', profile.bloodGroup); } catch(err) {} }
    document.getElementById('payment-form').addEventListener('submit', async (e) => { e.preventDefault(); if (!pendingAppointment) return; const btn = document.getElementById('pay-now-btn'); const selected = document.querySelector('input[name="paymentMethod"]:checked'); btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...'; alertEl.classList.add('d-none'); try { const payment = await PaymentAPI.pay(pendingAppointment.doctorId, pendingAppointment.consultationFee, selected.value); if ((payment.paymentStatus || '').toUpperCase() !== 'SUCCESS') throw new Error('Payment was not successful. Please try again.'); await post('/patient/appointments/book', { doctorId: pendingAppointment.doctorId, appointmentDate: pendingAppointment.appointmentDate, appointmentTime: pendingAppointment.appointmentTime, reasonForVisit: pendingAppointment.reasonForVisit, symptoms: pendingAppointment.symptoms }); localStorage.removeItem('pending_payment_appointment'); localStorage.setItem('payment_success_message', 'Payment Successful. Appointment Booked Successfully.'); window.location.href = '/patient-dashboard.html'; } catch(err) { alertEl.textContent = err.message; alertEl.className = 'alert alert-danger'; alertEl.classList.remove('d-none'); btn.disabled = false; btn.innerHTML = '<i class="bi bi-lock-fill me-1"></i>Pay Now'; } });
    renderSummary(); renderPatientDetails();
  </script>
</body>
</html>
