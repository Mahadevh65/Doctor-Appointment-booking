# ============================================================
# Hospital Appointment Management System - Application Config
# ============================================================

# Server
server.port=8082
spring.application.name=hospital-management

# ─── Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Mahadev@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable open-in-view warning
spring.jpa.open-in-view=false

# ─── JWT ────────────────────────────────────────────────────
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ─── Static Resources ───────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

# ─── Logging ────────────────────────────────────────────────
logging.level.com.hospital=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.servlet.resource=WARN
